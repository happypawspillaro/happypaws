{% extends "base.html" %}
{% block title %}Eliminar {{ animal.nombre }} · Panel{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-body">
        <h1 class="h4">Eliminar animal</h1>
        <p>¿Seguro que deseas eliminar a <strong>{{ animal.nombre }}</strong>? Esta acción no se puede deshacer.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a href="{% url 'animals:manage_detail' animal.pk %}" class="btn btn-outline-secondary">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
