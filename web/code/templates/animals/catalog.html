{% extends "base.html" %}
{% block title %}Adopta · Happy Paws Píllaro{% endblock %}
{% block content %}
<div class="mb-8">
  <h1 class="text-3xl font-bold text-slate-900">Animales en adopción</h1>
  <p class="mt-2 text-slate-600">Dale un hogar responsable a un perro o gato rescatado.</p>
</div>

<div class="grid grid-cols-1 gap-8 lg:grid-cols-4">
  <aside class="lg:col-span-1">
    <div class="rounded-2xl bg-white p-5 ring-1 ring-slate-200 lg:sticky lg:top-24">
      <h2 class="flex items-center gap-2 text-sm font-semibold text-slate-900">
        <i class="bi bi-funnel text-primary"></i> Filtrar
      </h2>
      <form class="mt-4 space-y-4"
            hx-get="{% url 'animals:catalog' %}"
            hx-target="#grid-animales"
            hx-trigger="change"
            hx-indicator="#grid-loading">
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Especie</label>
          <select name="especie" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
            <option value="">Todas</option>
            {% for value, label in especies %}
              <option value="{{ value }}" {% if filtros.especie == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Sexo</label>
          <select name="sexo" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
            <option value="">Todos</option>
            {% for value, label in sexos %}
              <option value="{{ value }}" {% if filtros.sexo == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="mb-1 block text-sm font-medium text-slate-700">Tamaño</label>
          <select name="tamano" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 transition focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
            <option value="">Todos</option>
            {% for value, label in tamanos %}
              <option value="{{ value }}" {% if filtros.tamano == value %}selected{% endif %}>{{ label }}</option>
            {% endfor %}
          </select>
        </div>
      </form>
    </div>
  </aside>

  <div class="lg:col-span-3">
    <span id="grid-loading" class="htmx-indicator mb-3 inline-flex items-center gap-2 text-sm text-slate-500">
      <i class="bi bi-arrow-repeat animate-spin"></i> Cargando…
    </span>
    <div id="grid-animales">
      {% include "animals/_animal_grid.html" %}
    </div>
  </div>
</div>
{% endblock %}
