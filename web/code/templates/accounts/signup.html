{% extends "base.html" %}
{% block title %}Crear cuenta · Happy Paws Píllaro{% endblock %}
{% block content %}
<div class="mx-auto max-w-2xl">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="mb-1 text-2xl font-bold tracking-tight text-slate-900">Crear cuenta</h1>
    <p class="mb-6 text-sm text-slate-500">Únete para adoptar, reportar y seguir casos médicos.</p>

    <form method="post">
      {% csrf_token %}
      {% include "includes/form_fields.html" %}
      <button type="submit"
              class="mt-2 w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-dark">
        Registrarme
      </button>
    </form>

    <p class="mt-6 text-sm text-slate-500">
      ¿Ya tienes cuenta?
      <a class="font-semibold text-primary transition hover:text-primary-dark" href="{% url 'accounts:login' %}">Ingresa</a>
    </p>
  </div>
</div>
{% endblock %}
