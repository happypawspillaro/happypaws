{% extends "base.html" %}
{% block title %}Ingresar · Happy Paws Píllaro{% endblock %}
{% block content %}
<div class="mx-auto max-w-xl">
  <div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
    <h1 class="mb-1 text-2xl font-bold tracking-tight text-slate-900">Ingresar</h1>
    <p class="mb-6 text-sm text-slate-500">Accede a tu cuenta de Happy Paws Píllaro.</p>

    {% if form.errors %}
      <div class="mb-4 rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800" role="alert">
        Usuario o contraseña incorrectos.
      </div>
    {% endif %}

    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="mb-1 block text-sm font-medium text-slate-700" for="id_username">Usuario</label>
        <input type="text" name="username" id="id_username" required autofocus
               class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 transition placeholder:text-slate-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <div class="mb-6">
        <label class="mb-1 block text-sm font-medium text-slate-700" for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required
               class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-700 transition placeholder:text-slate-400 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
      </div>
      <button type="submit"
              class="w-full rounded-lg bg-primary px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-primary-dark">
        Ingresar
      </button>
    </form>

    <p class="mt-6 text-sm text-slate-500">
      ¿No tienes cuenta?
      <a class="font-semibold text-primary transition hover:text-primary-dark" href="{% url 'accounts:signup' %}">Regístrate</a>
    </p>
  </div>
</div>
{% endblock %}
