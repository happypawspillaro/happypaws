<article class="card h-100 shadow-sm border-0">
  <div class="card-body text-center d-flex flex-column align-items-center justify-content-center py-4">
    <i class="bi {{ metric_icon }} text-primary fs-2 mb-2"
       aria-hidden="true"></i>
    <p class="display-5 fw-bold text-primary mb-1">{{ metric_value }}</p>
    <h3 class="h6 text-secondary mb-0">{{ metric_label }}</h3>
  </div>
</article>
