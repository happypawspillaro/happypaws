{% load thumbnail %}
{% with primera_foto=fotos.first %}
  {% if primera_foto %}
    <img src="{% thumbnail primera_foto.imagen 'card' %}"
         class="card-img-top"
         alt="{{ caso.titulo }}"
         loading="lazy" />
  {% else %}
    <div class="card-img-placeholder">
      <i class="bi bi-bandaid"></i>
    </div>
  {% endif %}
{% endwith %}
