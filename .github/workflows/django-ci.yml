name: Django CI

on:
 push:
  branches:
   - main
 pull_request:
  branches:
   - main

permissions:
 contents: read

defaults:
 run:
  working-directory: web/code

env:
 SECRET_KEY: ci-secret-key-not-for-production
 DJANGO_SETTINGS_MODULE: happypaws.settings.local

jobs:
 test:
  name: Django tests
  runs-on: ubuntu-latest

  steps:
   - name: Checkout repository
     uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
     with:
      persist-credentials: false
      ref: ${{ github.event.pull_request.head.sha || github.sha }}

   - name: Set up Python
     uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
     with:
      python-version: "3.14"
      cache: pip
      cache-dependency-path: web/requirements.txt

   - name: Install dependencies
     run: |
      python -m pip install --upgrade pip
      python -m pip install -r ../requirements.txt
      python -m pip install coverage

   - name: Run Django tests with coverage
     run: |
      coverage run --rcfile=../../pyproject.toml --branch manage.py test
      coverage report --rcfile=../../pyproject.toml --show-missing
      coverage xml --rcfile=../../pyproject.toml -o coverage.xml

   - name: Upload coverage artifact
     if: always()
     uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
     with:
      name: django-coverage
      path: web/code/coverage.xml
      if-no-files-found: ignore

   - name: Upload coverage to Codecov
     uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
     with:
      files: web/code/coverage.xml
      fail_ci_if_error: true
      token: ${{ secrets.CODECOV_TOKEN }}
