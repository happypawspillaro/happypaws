name: Django CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read
  code-quality: write

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web/code

    env:
      # Only used by CI/tests. Never use this value in production.
      SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_SETTINGS_MODULE: happypaws.settings.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: web/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r web/requirements.txt
          python -m pip install coverage

      - name: Run Django tests with coverage
        run: |
          coverage run --branch manage.py test
          coverage report --show-missing
          coverage xml -o coverage.xml

      - name: Upload coverage to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1.4.4
        with:
          file: web/code/coverage.xml
          language: Python
          label: code-coverage/django

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: django-coverage
          path: web/code/coverage.xml
          if-no-files-found: ignore
