{% extends "base.html" %}
{% block title %}{{ titulo }} · Panel{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <h1 class="h3 mb-4">{{ titulo }}</h1>
    <form method="post" enctype="multipart/form-data" class="card shadow-sm">
      <div class="card-body">
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
      </div>
      <div class="card-footer bg-white d-flex gap-2">
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'animals:manage_list' %}" class="btn btn-outline-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
